name: Sync upstream

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge upstream main
        id: merge
        shell: bash
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://x-access-token:${UPSTREAM_TOKEN}@github.com/ghdtmddb/class_stock.git"
          git fetch --no-tags upstream main
          git remote set-url upstream https://github.com/ghdtmddb/class_stock.git

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-commit --no-ff upstream/main
          git restore --source=HEAD --staged --worktree .github/workflows

          if git diff --cached --quiet; then
            git merge --abort
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit --no-edit
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: npm ci

      - name: Verify update
        if: steps.merge.outputs.changed == 'true'
        run: npm run check

      - name: Push synchronized main
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
